map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name localhost;
    server_tokens off;
    # Keep the external host/port when port 80 is published as 8088.
    absolute_redirect off;
    root /usr/share/nginx/html;
    charset utf-8;
    client_max_body_size 2m;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /api/v1/docs { return 308 /api/v1/docs/; }
    location = /api/v1/docs/openapi.yaml {
        proxy_pass http://api:8090/openapi/openapi.yaml;
    }
    location ^~ /api/v1/docs/ {
        proxy_pass http://api:8090/swagger/;
        proxy_redirect /swagger/ /api/v1/docs/;
    }
    location = /api/v1 { proxy_pass http://api:8090; }
    location /api/v1/ { proxy_pass http://api:8090; }

    location = /legacy { return 308 /legacy/; }
    location /legacy/ {
        proxy_pass http://blazor:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location = /documentation { try_files /documentation.html =404; }
    location /documentation/assets/ { try_files $uri =404; }
    location = / { try_files /static/index.html =404; }
    location /static/ { try_files $uri =404; }
    location = /reserved { return 308 /reserved/; }
    location = /reserved/ { try_files /static/index.html =404; }
    location = /management { try_files /management.html =404; }

    # Only NGINX is published, on host loopback. Do not publish pgAdmin directly.
    location = /admin {
        auth_basic "ATAP administration";
        auth_basic_user_file /etc/nginx/secrets/htpasswd;
        # try_files keeps access checks before the redirect (return runs earlier).
        try_files /__no_admin_index__ @admin_redirect;
    }
    location @admin_redirect { return 308 /admin/; }
    location /admin/ {
        auth_basic "ATAP administration";
        auth_basic_user_file /etc/nginx/secrets/htpasswd;
        proxy_pass http://pgadmin:80;
        proxy_set_header Host $http_host;
        proxy_set_header X-Script-Name /admin;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "";
        proxy_redirect off;
    }
    location = /status {
        auth_basic "ATAP administration";
        auth_basic_user_file /etc/nginx/secrets/htpasswd;
        stub_status;
    }
    location = /health {
        default_type text/plain;
        return 200 "alive\n";
    }
    location = /ready { proxy_pass http://api:8090/internal/ready; }
    location / { return 404; }
}
